# ============================================================
#  make.conf — Gentoo a medida (optimizado para hardware moderno)
#  Copiado automáticamente por install.sh a /etc/portage/make.conf
#  Editá SOLO si sabés lo que hacés. Los defaults sirven para
#  95% de las PCs x86_64 de los últimos 10 años.
# ============================================================

# --- CPU: compilación nativa (máximo rendimiento en TU máquina) ---
# Si instalás en una máquina y después movés el disco a otra,
# cambiá -march=native por -march=x86-64-v3
COMMON_FLAGS="-march=native -O3 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# --- Paralelismo: usa todos los cores ---
MAKEOPTS="-j$(nproc) -l$(nproc)"
EMERGE_DEFAULT_OPTS="--jobs=$(nproc) --load-average=$(nproc) --ask --verbose --quiet-build=y"

# --- Linker rápido + LTO (binarios más chicos y rápidos) ---
LDFLAGS="-Wl,-O1 -Wl,--as-needed -Wl,-z,pack-dyn-reloc,-z,relro,-z,now"
LDFLAGS_BINPKG="-Wl,-O1 -Wl,--as-needed"
# mold es ~3x más rápido que ld.bfd; si no está instalado, portage usa bfd
# (se instala solo vía dev-util/mold en world)
PORTAGE_BINPKG_FORMAT="xpak"
FEATURES="parallel-fetch buildpkg splitdebug compressdebug -ipc-sandbox -pid-sandbox -network-sandbox"
# LTO global: cuidado, sube mucho el uso de RAM. Activado en nivel conservador.
# Si tenés <16GB RAM, descomentá la línea siguiente y comentá esta:
# LTO="-flto=auto -fuse-linker-plugin"
# (con 16GB+ dejá la de abajo)
LTO="-flto=auto -fuse-linker-plugin"
# Para paquetes que no toleran LTO, ver package.env (per-package)

# --- USE flags globales: mínimos pero útiles en desktop ---
USE="acl acpi alsa bluetooth bzip2 cli consolekit crypt cups dbus dri egl
     elogind ext4 ffmpeg flac glib gpm gtk3 jpeg lzma mmx mp3 mpeg ncurses
     nls nptl ogg opengl pam pcre pdf png policykit pulseaudio readline
     sdl sound spell ssl svg threads tiff udev unicode usb v4l vorbis
     wifi xattr xorg zlib zstd
     -minimal -doc -gnome -kde -qt5 -qt6 -systemd -selinux -ipv6
     -debug -nls -test"

# --- Video / input: autodetección amplia (funciona en casi todo) ---
VIDEO_CARDS="intel radeon amdgpu nouveau nvidia"
INPUT_DEVICES="libinput"

# --- Idioma / locale ---
LINGUAS="es es_PY en"
L10N="es es-PY en"

# --- Licencias ---
ACCEPT_LICENSE="* -@EULA"

# --- Python / Ruby: versiones estables ---
PYTHON_TARGETS="python3_12 python3_13"
PYTHON_SINGLE_TARGET="python3_13"
RUBY_TARGETS="ruby32"

# --- Portage ---
PORTAGE_TMPDIR="/var/tmp/portage"
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_USERNAME="portage"
PORTAGE_GRPNAME="portage"

# --- Compilación remota (opcional, comentada) ---
# Si tenés otra máquina potente en la red, descomentá:
# DISTCC_HOSTS="192.168.1.100"
# FEATURES="distcc"

# --- Seguridad ---
FEATURES="${FEATURES} userpriv usersandbox"
# FEATURES="${FEATURES} sandbox"

# --- Binpkgs: preferir binarios cuando existan (instalación rápida) ---
# (Gentoo ya ofrece binpkgs oficiales para amd64; esto los prioriza)
EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --binpkg-respect-use=y"
